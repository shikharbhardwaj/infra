# Installer image built from ../schematic.yaml (schematic ID below) - keep the
# version in step with the Talos version the node runs, and bump both via
# `talosctl upgrade --image <this>` rather than editing alone.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/8cdf4cd0a3a9fa4771aab65437032804940f2115b1b1ef6872274dde261fa319:v1.14.2
provisioning:
  # Proxmox VirtIO SCSI system disk. App data never lands here - it lives on
  # truenas-saras via truenas-csi.
  diskSelector:
    match: disk.dev_path == "/dev/sda"
