# Rendered from the k8s ansible vault by tools/substitute.
apiVersion: v1
kind: Secret
metadata:
  name: litellm
type: Opaque
stringData:
  # Same master key as on gliese, so existing clients (Obsidian Copilot) and
  # virtual keys keep working after the move.
  LITELLM_MASTER_KEY: "{{ litellm_master_key }}"
  OPENROUTER_API_KEY: "{{ openrouter_api_key }}"
---
# Backblaze B2 credentials for the Barman Cloud Plugin's ObjectStore - the
# same bucket/key tenzing's CNPG clusters use, under an edmund/ prefix.
apiVersion: v1
kind: Secret
metadata:
  name: b2-backup-creds
type: Opaque
stringData:
  ACCESS_KEY_ID: "{{ cnpg_backup_key_id }}"
  ACCESS_SECRET_KEY: "{{ cnpg_backup_secret_key }}"
