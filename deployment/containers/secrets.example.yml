cf_dns_api_token: ""
oci_host: ""
oci_parent_host: ""
# Local-network domain, used alongside oci_parent_host for dual-host routing
# on hosts whose services should also be reachable without going out to the
# public domain (e.g. gliese: budget.gliese.lan works on the LAN even if
# budget.{{ oci_parent_host }} is unreachable).
local_host: ""
thor_tailscale_ip: ""
tenzing_host: ""
jellyfin_tailscale_ip: ""
# Mac's tailnet IP - lets the litellm proxy on gliese reach LM Studio's
# OpenAI-compatible server running on the mac (http://<ip>:1234/v1).
mac_tailscale_ip: ""

# vmagent (on tyr) scrapes each fleet host's node_exporter/windows_exporter/
# LibreHardwareMonitor over Tailscale IPs - see deployment/containers/vmagent.
# Plain MagicDNS hostnames don't work here: podman's netavark backend
# overrides --dns with the network's own aardvark-dns regardless, and even
# bypassing that, Tailscale's quad-100 resolver (100.100.100.100) isn't
# reliably reachable from a container's separate network namespace. tyr's
# own tailscale IP is needed too since a container can't reach the host it
# runs on via localhost.
arete_tailscale_ip: ""
saras_tailscale_ip: ""
gliese_tailscale_ip: ""
# gliese's WSL2 distro is a *separate* tailnet node from the Windows host
# (gliese_tailscale_ip above). windows_exporter/LHM run on Windows; podman
# containers (litellm, traefik, shelly-plug-monitor) run in WSL2 and are
# reached at this IP. Needed to scrape the shelly-plug-monitor exporter.
gliese_wsl_tailscale_ip: ""
tyr_tailscale_ip: ""
# TrueNAS VM guests (appliances, not the Proxmox hosts of the same name). Their
# node_exporter runs as a host-networked Custom App, so this is the VM's own
# tailnet IP (its Tailscale runs host-networked) - see deployment/truenas/. Add
# truenas_thor_tailscale_ip when the thor TrueNAS VM is onboarded.
truenas_saras_tailscale_ip: ""

# Grafana admin login (deployment/containers/grafana).
grafana_admin_password: ""

# Device list for shelly-plug-monitor (deployment/containers/shelly-plug-monitor,
# runs on gliese). JSON consumed as-is by the exporter; each device has the
# plug's LAN ip, its Switch id, a friendly_name (becomes the device_name label
# on the Grafana dashboard) and key (the plug's digest-auth password). Same
# secret the k8s deployment uses. Provide as a YAML block scalar, e.g.:
#   shelly_plug_device_config: |
#     {"devices": [
#       {"id": "0", "ip": "192.168.1.50", "friendly_name": "office", "key": "..."}
#     ]}
shelly_plug_device_config: ""

# Discord webhook URL that Grafana-managed alerts post to (fleet alerting,
# grafana/provisioning/alerting/). Can be the same channel/webhook uptime-kuma
# already uses, or a dedicated #monitoring one.
alert_discord_webhook_url: ""

# Traefik host-side port overrides. Defaults below match tyr; gliese should
# override these (e.g. 8080/8043/8081) since 80/443 are already in use there.
traefik_http_port: "80"
traefik_https_port: "443"
traefik_dashboard_port: "8080"

# CrowdSec bouncer API key - generate on the crowdsec container after first
# start with: podman exec crowdsec cscli bouncers add crowdsec-bouncer
crowdsec_bouncer_api_key: ""

# Replay Hub WebDAV credentials (optional - only if using WebDAV storage)
webdav_url: ""
webdav_username: ""
webdav_password: ""

# LiteLLM proxy - OpenRouter key for non-local/non-sensitive routing, and the
# master key clients (Obsidian Copilot, MCP servers) must present to the proxy.
openrouter_api_key: ""
litellm_master_key: ""
# Postgres backing store for the admin UI (virtual keys/teams/spend
# tracking) - required for /ui login to work at all. litellm_db_password is
# consumed directly by the litellm-db container as POSTGRES_PASSWORD;
# litellm_db_url is the full connection string litellm itself gets as
# DATABASE_URL, so the password must be copied into both by hand
# (postgresql://litellm:<same password>@litellm-db:5432/litellm).
litellm_db_password: ""
litellm_db_url: ""

# obsidian-sync-mcp - talks to the obsidian-couchdb LiveSync backend on
# tenzing (deployment/kubernetes/kustomize/obsidian-couchdb), not the vault
# filesystem. Credentials must match what's configured there (a separate,
# ansible-vault-managed secret store - not shared with this file, copy the
# values over by hand). obsidian_couchdb_database/obsidian_vault_name come
# from the Self-hosted LiveSync plugin's setup wizard, not secrets exactly,
# but host-specific config that belongs here all the same.
obsidian_couchdb_user: ""
obsidian_couchdb_pass: ""
obsidian_couchdb_database: ""
obsidian_vault_name: ""
# E2E encryption passphrase - must match the Self-hosted LiveSync plugin's
# settings exactly, or obsidian-sync-mcp can't decrypt chunks. Path
# obfuscation is off, so there's no corresponding obfuscation setting here.
obsidian_couchdb_passphrase: ""
# Bearer token Obsidian Copilot must present to obsidian-sync-mcp's /mcp
# endpoint - generate any random string.
mcp_auth_token: ""
