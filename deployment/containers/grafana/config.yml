podman_secrets:
- grafana_admin_password

# Copied verbatim by install (no secret substitution): provisioned dashboard
# JSON uses Grafana's own double-brace legend templating (host, chip, ...),
# which would otherwise be mistaken for our secret placeholders. These files
# hold no secrets - the datasource is referenced by uid, not credentials.
render_exclude:
- provisioning/dashboards/json/*.json
# Alert rule summaries use Go {{ }} templating ({{ $labels.host }} etc.) that
# must reach Grafana verbatim. contactpoints.yaml is NOT excluded - it needs
# its {{ alert_discord_webhook_url }} secret substituted.
- provisioning/alerting/rules.yaml
