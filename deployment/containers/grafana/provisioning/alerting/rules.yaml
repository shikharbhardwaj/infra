# GENERATED by scratchpad gen_alerts.py - Grafana-managed alert rules,
# provisioned as code. Render-excluded (summaries use Go {{ }} templating,
# which must reach Grafana verbatim, not be eaten by install's secret
# substitution). Each rule: instant PromQL query A -> threshold C.
apiVersion: 1
groups:
- orgId: 1
  name: fleet
  folder: Alerts
  interval: 1m
  rules:
  - uid: fleet-fs-full-warn
    title: Root filesystem nearly full
    condition: C
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} root disk ({{ $labels.mount }}) is {{ printf "%.0f" (mul $values.A.Value
        100) }}% full'
      description: Root filesystem above 90% for 15m.
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics
      model:
        refId: A
        datasource:
          type: prometheus
          uid: victoriametrics
        editorMode: code
        expr: node:fs_mount_utilization:ratio{host!="", mount=~"/|C:"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
