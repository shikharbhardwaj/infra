  - uid: fleet-fs-predict-24h
    title: Root filesystem will fill within 24h
    condition: C
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} root disk is on track to fill within 24h'
      description: Linear projection of root free space over the last 6h crosses zero within a day - catch
        runaway logs before 100%.
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
