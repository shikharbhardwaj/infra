# vmagent scrape config - one job per fleet host, all reached by plain
# Tailscale MagicDNS node name (see the DNS=100.100.100.100 directive in
# vmagent.container) rather than raw LAN IPs or per-host tailscale-ip
# secrets - not every host is confirmed to share a LAN with tyr, and tyr
# already has proven tailnet reachability to everything. tyr's own
# node_exporter is scraped the same way as everyone else's, rather than via
# "localhost" - a container can't reach the host that way.
scrape_configs:
  - job_name: tyr
    static_configs:
      - targets: ["tyr:9100"]

  - job_name: arete
    static_configs:
      - targets: ["arete:9100"]

  - job_name: thor
    static_configs:
      - targets: ["thor:9100"]

  - job_name: saras
    static_configs:
      - targets: ["saras:9100"]

  # windows_exporter's textfile collector merges in lhm_exporter's sensor
  # data (LibreHardwareMonitor), so this is one job/port, not two - see
  # CLAUDE.md's "Hardware/sensor monitoring" section for how that's wired
  # up on gliese.
  - job_name: gliese
    static_configs:
      - targets: ["gliese:9182"]
