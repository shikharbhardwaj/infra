apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
      traefik.ingress.kubernetes.io/router.middlewares: dev-https-redirect@kubernetescrd
  name: main-ingress
  labels:
    name: main-ingress
spec:
  tls:
  - hosts:
    - "{{ host }}"
    - "*.{{ host }}"
    # office.{{ parent_host }} is also covered - the dev-namespace cert's
    # dnsNames already include "*.{{ parent_host }}" (see
    # ../../letsencrypt/base/certificate.yml), no cert change needed.
    - "office.{{ parent_host }}"
    secretName: tenzing-dev-cert-tls
  rules:
  - host: "{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: homepage
            port: 
              number: 3000
  - host: "homeassistant.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: home-assistant
            port: 
              number: 80
  - host: "docker-registry.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: docker-registry
            port: 
              number: 5000
  - host: "vault.{{ parent_host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: vaultwarden
            port: 
              number: 80
  - host: "mlflow.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: mlflow
            port: 
              number: 5000
  - host: "minio.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: minio
            port: 
              number: 9090
  - host: "minio-api.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: minio
            port: 
              number: 9000
  - host: "sabnzbd.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: sabnzbd
            port:
              number: 8080
  - host: "deluge.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: deluge
            port:
              number: 8112
  - host: "radarr.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: radarr
            port: 
              number: 7878
  - host: "prowlarr.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: prowlarr
            port: 
              number: 9696
  - host: "sonarr.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: sonarr
            port: 
              number: 8989
  - host: "shell.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: ttyd
            port: 
              number: 7681
  - host: "readarr.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: readarr
            port: 
              number: 8787
  - host: "kavita.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: kavita
            port: 
              number: 5000
  - host: "truecommand.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: truecommand
            port: 
              number: 80
  - host: "paperless.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: paperless-ngx
            port: 
              number: 8000
  - host: "linkwarden.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: linkwarden
            port: 
              number: 3000
  - host: "obsidian-couchdb.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: obsidian-couchdb
            port: 
              number: 5984
  - host: "crafty.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: crafty
            port: 
              number: 8443
  - host: "byparr.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: byparr
            port:
              number: 8191
  - host: "speedtest.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: openspeedtest
            port:
              number: 3000
  - host: "office.{{ host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: onlyoffice-documentserver
            port:
              number: 80
  # Public path, via tyr's traefik (see external-routes.container's "office"
  # router) - relies on JWT_ENABLED (already on) as the only gate, same as
  # office.{{ host }} above. Kept as a bare-root DocumentServer URL rather
  # than a subpath off drive.{{ parent_host }}: the Nextcloud onlyoffice
  # connector app double-concatenates a non-root DocumentServerUrl with
  # DocumentServer's own X-Forwarded-Host-derived absolute URLs (confirmed
  # live 2026-09-20 - every conversion/callback round-trip 404s on
  # .../onlyoffice/onlyoffice/...), so a real subdomain is the only path
  # that doesn't fight the connector app's own URL-joining logic.
  - host: "office.{{ parent_host }}"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: onlyoffice-documentserver
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: dev
spec:
  redirectScheme:
    scheme: https
    permanent: true