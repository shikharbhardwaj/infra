apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
spec:
  valuesContent: |-
    ports:
      web:
        transport:
          respondingTimeouts:
            readTimeout: "0"
            writeTimeout: "0"
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: "0"
            writeTimeout: "0"
    providers:
      kubernetesCRD:
        # Default flipped to false in chart 10.3.1+ - needed so an
        # IngressRoute in one namespace (e.g. nextcloud-prod) can target a
        # Service in another (e.g. onlyoffice-documentserver in dev).
        allowCrossNamespace: true
