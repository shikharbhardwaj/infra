# ah-invoices: Albert Heijn receipt sync + analytics + monthly shopping list.
#
# Upstream: https://github.com/salujayatharth/ah-api
# Fork (built by tag-triggered workflow to ghcr.io/shikharbhardwaj/ah-api):
#   https://github.com/shikharbhardwaj/ah-api (branch: homelab)
#
# Security notes:
# - The app has NO authentication of its own and exposes the full purchase
#   history. Its ingress host is a tailscale-only hostname (private DNS), and
#   the upstream CORS wildcard was removed in the fork. Do NOT add a public
#   route without putting forward-auth in front.
# - The OAuth refresh token lives in /data/.tokens.json (0600 in the fork)
#   on the app's volume. Volume access == AH account access.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ah-invoices
spec:
  serviceName: ah-invoices
  replicas: 1
  selector:
    matchLabels:
      app: ah-invoices
  template:
    metadata:
      labels:
        app: ah-invoices
    spec:
      containers:
      - name: ah-invoices
        image: "ghcr.io/shikharbhardwaj/ah-api:sha-e76419f"
        ports:
        - containerPort: 8000
          name: web
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        env:
        # CORS is off by default in the fork; no CORS_ORIGINS set on purpose.
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: web
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: web
          initialDelaySeconds: 5
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
