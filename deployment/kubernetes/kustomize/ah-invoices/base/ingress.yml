# Tailscale-only hostname (private DNS record), not publicly routable.
# The app itself has no auth and exposes the full AH purchase history.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
      traefik.ingress.kubernetes.io/router.middlewares: ah-invoices-https-redirect@kubernetescrd
  name: ah-invoices-ingress
  labels:
    name: ah-invoices-ingress
spec:
  tls:
  - hosts:
    - "ah-invoices.{{ host }}"
    secretName: tenzing-dev-cert-tls
  rules:
  - host: "ah-invoices.{{ host }}"
    http:
      paths:
      - backend:
          service:
            name: ah-invoices
            port:
              number: 8000
        path: /
        pathType: Prefix
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ah-invoices-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
