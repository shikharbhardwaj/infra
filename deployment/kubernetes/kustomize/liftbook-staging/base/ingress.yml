apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
      traefik.ingress.kubernetes.io/router.middlewares: dev-https-redirect@kubernetescrd
  name: liftbook-staging-ingress
  labels:
    name: liftbook-staging-ingress
spec:
  tls:
  - hosts:
    - "liftbook-staging.{{ host }}"
    secretName: tenzing-dev-cert-tls
  rules:
  - host: "liftbook-staging.{{ host }}"
    http:
      paths:
      - backend:
          service:
            name: liftbook-staging-liftbook
            port:
              number: 3000
        path: /
        pathType: Prefix
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
