apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
      traefik.ingress.kubernetes.io/router.middlewares: immich-large-upload@kubernetescrd,dev-https-redirect@kubernetescrd
  name: nextcloud-ingress
  labels:
    name: nextcloud-ingress
spec:
  tls:
  - hosts:
    - "drive.{{ parent_host }}"
    - "drive.{{ host }}"
    secretName: tenzing-dev-cert-tls
  defaultBackend:
    service:
      name: nextcloud
      port:
        number: 80
  rules:
  - host: "drive.{{ parent_host }}"
    http:
      paths:
      - backend:
          service:
            name: nextcloud
            port:
              name: http
        path: /
        pathType: Prefix
  - host: "drive.{{ host }}"
    http:
      paths:
      - backend:
          service:
            name: nextcloud
            port:
              name: http
        path: /
        pathType: Prefix
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: large-upload
spec:
  buffering:
    maxRequestBodyBytes: 10737418240
    maxResponseBodyBytes: 10737418240
    memRequestBodyBytes: 10485760
    memResponseBodyBytes: 10485760
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: onlyoffice-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /onlyoffice
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: onlyoffice-forwarded-host
spec:
  # OnlyOffice DocumentServer builds all of its own asset/websocket URLs from
  # X-Forwarded-Host, and (per ONLYOFFICE's own virtual-path proxy example)
  # expects the mount path appended to the host, not just the bare host - a
  # bare X-Forwarded-Host here would make the editor emit root-relative
  # asset URLs that 404 once it's actually served from /onlyoffice.
  headers:
    customRequestHeaders:
      X-Forwarded-Host: "drive.{{ parent_host }}/onlyoffice"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onlyoffice-drive
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`drive.{{ parent_host }}`) && PathPrefix(`/onlyoffice`)
      kind: Rule
      # Must outrank nextcloud-ingress's catch-all PathPrefix(`/`) on the same
      # host; Traefik's length-based default priority would likely do this
      # anyway, but pin it explicitly rather than rely on that.
      priority: 100
      middlewares:
        - name: onlyoffice-stripprefix
        - name: onlyoffice-forwarded-host
      services:
        # onlyoffice-documentserver lives in the dev namespace, not
        # nextcloud-prod - requires allowCrossNamespace (see
        # ../../traefik-config/base/helmchartconfig.yml).
        - name: onlyoffice-documentserver
          namespace: dev
          port: 80
  tls:
    secretName: tenzing-dev-cert-tls