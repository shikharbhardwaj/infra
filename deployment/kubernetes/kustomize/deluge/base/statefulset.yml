apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: deluge
spec:
  selector:
    matchLabels:
      app: deluge
  serviceName: deluge
  replicas: 1
  template:
    metadata:
      labels:
        app: "deluge"
    spec:
      # gluetun points the pod's resolv.conf at its own DNS server, which answers
      # nonexistent names (e.g. the k8s search-suffixed "x.dev.svc.cluster.local")
      # with NOERROR/no-data instead of NXDOMAIN. musl (Alpine deluge) treats that
      # as final and never tries the bare name, so every lookup failed. ndots:1
      # makes dotted names skip the search list entirely.
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      securityContext:
        fsGroup: 1000
      containers:
      - name: "deluge"
        image: "lscr.io/linuxserver/deluge:latest"
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8112
        - containerPort: 6881
        - containerPort: 58846
        volumeMounts:
        - mountPath: /data/media
          name: media
        - mountPath: /config
          name: config
      - name: gluetun
        image: qmcgaw/gluetun:v3.40.3
        env:
        - name: VPN_SERVICE_PROVIDER
          value: surfshark
        envFrom:
        - secretRef:
            name: deluge-surfshark-creds
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: deluge-media-pvc
  volumeClaimTemplates:
  - metadata:
      name: config
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
      storageClassName: freenas-nfs-csi

