---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-prod-daily-backup
  namespace: cloudnative-pg
spec:
  # CNPG cron is 6-field (seconds first); this is daily at 02:00:00.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: nextcloud-prod
  immediate: true
  method: barmanObjectStore
