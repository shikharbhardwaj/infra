---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud
  namespace: cloudnative-pg
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised

  imageName: ghcr.io/cloudnative-pg/postgresql:14

  # Legacy cluster, superseded by nextcloud-prod. Backup/WAL archiving removed:
  # it was failing continuously (barman-cloud-wal-archive exit 1), which piled up
  # thousands of stuck Backup CRs and risked unbounded pg_wal growth. Not backed
  # up by design — slated for decommission.

  storage:
    size: 10Gi
    storageClass: freenas-iscsi-csi

  managed:
    roles:
    - name: nextcloud
      superuser: true
      login: true

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-db-url
