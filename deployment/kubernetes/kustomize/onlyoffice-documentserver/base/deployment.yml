apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice-documentserver
spec:
  replicas: 1
  # RWO volumes + replicas:1: Recreate tears down the old pod before starting
  # the new one, avoiding a multi-attach deadlock on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onlyoffice-documentserver
  template:
    metadata:
      labels:
        app: onlyoffice-documentserver
    spec:
      # The freenas-nfs-csi backend only root-squashes to `kubeuser` (uid/gid 1000) -
      # it never grants ds (101:102, the image's fixed docservice/converter user) any
      # chown/chgrp rights, so the image's own entrypoint chown (root, squashed to
      # kubeuser) fails, and a k8s fsGroup chgrp fares no better (also risks being
      # wiped by supervisord's initgroups() call when it drops root to `user=ds`).
      # chmod as squashed-root DOES work (kubeuser already owns these paths), but an
      # initContainer can't apply it - confirmed live (2026-09-20) that the
      # entrypoint's own setup does an equivalent chmod-back-to-0755 (silent, unlike
      # the chown it pairs it with, which errors loudly) early in ITS OWN boot,
      # unconditionally undoing anything an initContainer set beforehand, well before
      # docservice's first storage healthcheck. Since initContainers always finish
      # before the main container's entrypoint even starts, no initContainer command
      # can run after that reset. A sidecar that keeps re-applying it wins instead:
      # entrypoint's reset happens once early in boot, so the loop only has to land
      # one chmod after it (confirmed live: ds then creates everything under these
      # paths itself, correctly owned, since non-root ops pass the NFS export
      # unmapped - the squash only ever touches root).
      containers:
      - name: fix-nfs-permissions
        image: busybox:1.36
        command: ["sh", "-c", "while true; do chmod -R a+rwX /var/lib/onlyoffice /var/log/onlyoffice /var/www/onlyoffice/Data; sleep 5; done"]
        volumeMounts:
        - name: lib
          mountPath: /var/lib/onlyoffice
        - name: logs
          mountPath: /var/log/onlyoffice
        - name: data
          mountPath: /var/www/onlyoffice/Data
        resources:
          limits:
            memory: "16Mi"
            cpu: "50m"
      - name: onlyoffice-documentserver
        # Pinned (was :latest) to the version running in prod at time of writing.
        image: onlyoffice/documentserver:9.4.0
        ports:
        - containerPort: 80
          name: http
        env:
        - name: JWT_ENABLED
          value: "true"
        envFrom:
        - secretRef:
            name: onlyoffice-documentserver-env
        resources:
          requests:
            # Account for whatever still lands on ephemeral storage so the
            # scheduler reserves it and this pod is no longer the automatic
            # eviction victim under node disk pressure.
            ephemeral-storage: "512Mi"
          limits:
            memory: "2Gi"
            cpu: "2"
            ephemeral-storage: "2Gi"
        # OnlyOffice serves 200 on /healthcheck once all bundled services are up.
        # startupProbe gives the bundled Postgres/RabbitMQ migrations time before
        # liveness starts killing; readiness gates traffic until ready.
        startupProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: lib
          mountPath: /var/lib/onlyoffice
        - name: db
          mountPath: /var/lib/postgresql
        - name: logs
          mountPath: /var/log/onlyoffice
        - name: data
          mountPath: /var/www/onlyoffice/Data
      volumes:
      - name: lib
        persistentVolumeClaim:
          claimName: onlyoffice-lib
      - name: db
        persistentVolumeClaim:
          claimName: onlyoffice-db
      - name: logs
        persistentVolumeClaim:
          claimName: onlyoffice-logs
      - name: data
        persistentVolumeClaim:
          claimName: onlyoffice-data
