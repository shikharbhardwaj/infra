# Canonical inventory of the physical/VM hosts in this homelab.
#
# This is the single tracked source of truth for "what hosts exist" - update
# it first when adding, removing, or re-purposing a host, then bring
# README.md's Host inventory table, hosts.example (ansible), and
# deployment/containers/inventory.yml (podman-managed hosts) in line with it.
#
# Not listed here: tenzing (the k3s cluster - a group of nodes, not a single
# host; see deployment/kubernetes/) and mac (tracked in README.md, but not
# yet folded into this inventory).

hosts:
  arete:
    type: proxmox-hypervisor
    role: Proxmox VE host
    managed_via: ansible (proxmox_hosts group)
    tailnet: true

  thor:
    type: proxmox-hypervisor
    role: Proxmox VE host
    managed_via: ansible (proxmox_hosts group)
    tailnet: true

  tyr:
    type: oracle-cloud-vm
    role: Public-facing utility host (traefik, crafty, uptime-kuma, victoria-metrics, vmagent, vmalert, grafana)
    managed_via: deployment/containers (inventory.yml) + ansible (node_exporter_hosts group)
    tailnet: true

  gliese:
    type: windows-wsl2
    role: Home services host (traefik, actual-budget, replay-hub, litellm)
    managed_via: deployment/containers (inventory.yml)
    tailnet: true

  saras:
    type: proxmox-hypervisor
    role: Proxmox VE host
    managed_via: ansible (proxmox_hosts group)
    tailnet: true

  truenas-saras:
    type: truenas-vm
    role: NAS VM on saras (HBA PCIe-passthrough); monitored via node_exporter Custom App
    managed_via: deployment/truenas/saras (hand-applied via TrueNAS UI, like mac)
    tailnet: true

  truenas-thor:
    type: truenas-vm
    role: NAS VM on thor (HBA PCIe-passthrough); monitoring deferred - onboard like truenas-saras
    managed_via: deployment/truenas (hand-applied via TrueNAS UI, like mac)
    tailnet: false
