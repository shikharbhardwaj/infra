---
- name: Configure netdata streaming (parent on tyr, children elsewhere)
  hosts: netdata_hosts
  become: true

  tasks:
    - name: Render stream.conf for this host's netdata_role
      ansible.builtin.template:
        src: templates/stream.conf.j2
        dest: /etc/netdata/stream.conf
        mode: "0640"
      notify: restart netdata

  handlers:
    - name: restart netdata
      ansible.builtin.systemd:
        name: netdata
        state: restarted
