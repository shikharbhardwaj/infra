---
- name: Install and enable node_exporter
  hosts: node_exporter_hosts
  become: true

  tasks:
    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Enable and start prometheus-node-exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: started
        enabled: true
