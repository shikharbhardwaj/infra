name: renovate

# Self-hosted Renovate: scans the repo's pinned Helm charts (Argo CD
# Application manifests under deployment/kubernetes/argocd/ and vendored
# Chart.yaml dependencies) and opens PRs for updates. Behaviour is driven by
# renovate.json5 at the repo root; this workflow only schedules the run.

on:
  schedule:
    # Weekly, Monday 02:00 IST (Sunday 20:30 UTC) - a ~4h buffer before
    # renovate.json5's own "before 6am on monday" PR window closes, since
    # GitHub scheduled workflows can be delayed (notably around the top of
    # the hour) and a tight buffer risks the run landing outside its own
    # window and silently skipping the week.
    - cron: "30 20 * * 0"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (log only, open no PRs)"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # GitHub-hosted: Renovate needs outbound access to github.com and the
    # upstream chart repos, which the tailnet self-hosted runner is not meant
    # to carry. No cluster access is required to open PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: renovatebot/github-action@v46.2.4
        with:
          # Fine-grained PAT scoped to this repo with Contents: read/write,
          # Pull requests: read/write, and Issues: read/write (the
          # :dependencyDashboard issue plus PR label writes both need Issues
          # access). The default GITHUB_TOKEN is intentionally not used — PRs
          # it opens cannot trigger ci.yml.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: '["shikharbhardwaj/infra"]'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
